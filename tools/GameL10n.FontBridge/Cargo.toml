# SPDX-License-Identifier: MIT
[package]
name = "gamel10n-fontbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
autotests = false

# This native component has a separate ABI and license from the application.
[workspace]

[lib]
name = "gamel10n_fontbridge"
crate-type = ["cdylib"]
test = false
doctest = false

[[bin]]
name = "fontbridge-check"
path = "tests/native.rs"
test = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
