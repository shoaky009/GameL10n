[package]
name = "gamel10n-qlie-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
publish = false

[workspace]

[[bin]]
name = "qlie-launcher"
path = "src/main.rs"

[dependencies]
roxmltree = "0.21.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
