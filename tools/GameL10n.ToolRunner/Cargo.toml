[package]
name = "gamel10n-tool-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
publish = false
autotests = false

[workspace]

[[bin]]
name = "gamel10n-tool-runner"
path = "src/main.rs"

[[bin]]
name = "isolation-fixture"
path = "tests/fixture.rs"
test = false

[[test]]
name = "isolation"
path = "tests/isolation.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
