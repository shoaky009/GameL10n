[package]
name = "gamel10n-game-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.62.2", features = [
    "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams",
    "Win32_Foundation", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
