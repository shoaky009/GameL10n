const projectDefs=[{id:'letter',name:'薄暮来信',engine:'Kirikiri / KAG',path:'I:\\Games\\薄暮来信'},{id:'seaside',name:'海边的约定',engine:'Ren’Py',path:'I:\\Games\\海边的约定'},{id:'summer',name:'夏日回响',engine:'System4',path:'I:\\Games\\夏日回响'}];
const STORAGE='gamel10n-workbench-prototype-v1';
function newProject(def,index){return {...def,units:samples.map((s,i)=>({id:i+1,speaker:s[0],kind:s[1],source:s[2],suggestion:s[3],text:index===2||i<22?s[3]:'',initial:index===2||i<22?s[3]:'',reviewed:[0,1,2,10].includes(i),human:false,failed:false,script:['prologue.ks','chapter01.ks','chapter02.ks'][Math.floor(i/12)]})),task:index===0?'running':index===1?'paused':'complete',tokens:index===0?28416:0,reused:16,newly:6,revision:0,selected:[],active:4,queue:null,patch:null,events:[{time:'14:32:06',message:'已复用上下文匹配的译文，继续处理未完成文本。'}]};}

try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved?.version===1&&saved.projects?.length===3&&saved.projects.every(p=>p.units?.length===samples.length)&&saved.projects.some(p=>p.id===saved.projectId))state=saved;}catch{}
let filter='all',page=0,pageSize=10,query='',scriptFilter='',kindFilter='',onlySelected=false,view='work',saveTimer,toastTimer,originalVisible=false,editorDirty=false,modalVersion=0;
const project=()=>state.projects.find(p=>p.id===state.projectId);
const activeUnit=()=>project().units.find(u=>u.id===project().active)||project().units[0];
const markers=t=>t.match(/\{[^{}]+\}|\\n|\[[a-z]+(?:=[^\]]+)?\]/gi)||[];
function problems(u,text=u.text){if(!text.trim())return[];const source=markers(u.source),target=markers(text);const all=[...new Set([...source,...target])];return all.flatMap(m=>{const a=source.filter(t=>t===m).length,b=target.filter(t=>t===m).length;return a>b?[`缺少 ${m}${a-b>1?' × '+(a-b):''}`]:b>a?[`多出 ${m}${b-a>1?' × '+(b-a):''}`]:[];});}

function patchStale(p=project()){if(!p.patch)return false;const patch=p.patch;const current=p.units.filter(u=>(!patch.scopeIds||patch.scopeIds.includes(u.id))&&u.text.trim()&&(!patch.reviewedOnly||u.reviewed));return JSON.stringify(current.map(u=>[u.id,u.text]))!==JSON.stringify(patch.units.map(u=>[u.id,u.text]));}

function renderTask(){const p=project(),c=counts();let title,sub,action,sign='play';const missing=c.total-c.translated;
 if(p.task==='running'){title=`正在翻译 · 已译 ${c.translated} / ${c.total} 条`;sub=`通用翻译 API · 复用 ${p.reused} 条 · 本轮新增 ${p.newly} 条 · ${p.tokens.toLocaleString()} Token`;action='暂停翻译';sign='pause';}
 else if(p.task==='error'){title='翻译已暂停 · 返回格式不正确';sub='5 次重试均未成功。已完成译文已保存，可以继续校对或重试未完成文本。';action='重试未完成';sign='alert';}

}
function installPatch(){const p=project();showModal('模拟安装补丁',`<p>将汉化文件安装到：</p><p class="candidate mono">${esc(p.path)}</p><p>需要替换的原文件会先备份为 .bak。安装前应关闭游戏。</p><p class="modal-note">本按钮仅演示安装后的界面状态，不访问游戏目录。</p>`,[{label:'取消',action:closeModal},{label:'确认模拟安装',primary:true,action:()=>{p.patch.installed=true;persist();closeModal();renderPatch();toast('模拟安装完成。实际字体与排版仍需进游戏确认。');}}]);}
function applyScenario(value){flushEdit();const p=project();p.queue=null;if(value==='running'){p.task='running';for(const u of p.units.slice(24))if(!u.human){u.text='';u.reviewed=false;u.failed=false;}p.revision++;}if(value==='error'){p.task='error';const target=p.units.find(u=>!u.text&&!u.human);if(target)target.failed=true;eventLog('返回格式不正确：模型返回条目不完整。已重试 5 次，任务暂停。');}if(value==='complete'){p.units.forEach(u=>{if(!u.human){u.text=u.suggestion;u.initial=u.suggestion;u.failed=false;}});p.task='complete';p.revision++;}if(value==='fresh'){const manual=p.units.filter(u=>u.human).length;p.units.forEach(u=>{if(!u.human){u.text='';u.initial='';u.reviewed=false;u.failed=false;}});p.task='fresh';p.tokens=0;p.newly=0;p.reused=manual;p.revision++;}persist();renderAll();toast('已切换演示情景；已有人工修改会保留。');}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='settings')showSettings();if(action==='global-settings')showSettings(true);if(action==='task-details')showTaskDetails();if(action==='build')buildPatch();if(action==='install')installPatch();if(action==='patch-texts'){showModal('本次补丁使用的文本',project().patch.units.map(u=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="small muted">第 ${u.id} 条 · ${esc(u.script)}</div><p>${esc(u.text)}</p></div>`).join(''),[{label:'关闭',action:closeModal}]);}if(action==='verify-game'){showModal('记录游戏内验证结果','<p>这里记录人工进入游戏后的检查结果，与结构检查分开显示。</p><p class="modal-note">原型没有实际运行游戏，这次记录仅用于预览状态变化。</p>',[{label:'尚未验证',action:closeModal},{label:'显示正常（演示）',primary:true,action:()=>{project().patch.verified=true;persist();closeModal();renderPatch();}}]);}});
$('project-list').addEventListener('click',e=>{const id=e.target.closest('[data-project]')?.dataset.project;if(!id||id===state.projectId)return;flushEdit();state.projectId=id;resetFilters();persist();renderAll();$('scenario').value=['running','error','fresh'].includes(project().task)?project().task:'complete';});
$('filter-tabs').addEventListener('click',e=>{const next=e.target.closest('[data-filter]')?.dataset.filter;if(!next)return;flushEdit();filter=next;refreshFilteredView();});
$('text-rows').addEventListener('click',e=>{if(e.target.closest('input'))return;const row=e.target.closest('[data-id]');if(row)selectUnit(Number(row.dataset.id));});
$('text-rows').addEventListener('keydown',e=>{if(e.target.matches('tr')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectUnit(Number(e.target.dataset.id));}});
$('text-rows').addEventListener('change',e=>{const input=e.target.closest('[data-select]');if(!input)return;const id=Number(input.dataset.select),p=project();p.selected=input.checked?[...new Set([...p.selected,id])]:p.selected.filter(v=>v!==id);persist();renderRows();});
$('select-page').addEventListener('change',e=>{const ids=visibleRows().map(u=>u.id),p=project();p.selected=e.target.checked?[...new Set([...p.selected,...ids])]:p.selected.filter(id=>!ids.includes(id));persist();renderRows();});
$('select-matches').onclick=()=>{project().selected=[...new Set([...project().selected,...filtered().map(u=>u.id)])];persist();renderRows();};
$('clear-selection').onclick=()=>{project().selected=[];persist();renderRows();};
$('clear-filters').onclick=resetFilters;
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();refreshFilteredView();});
$('script-filter').onchange=e=>{scriptFilter=e.target.value;refreshFilteredView();};
$('kind-filter').onchange=e=>{kindFilter=e.target.value;refreshFilteredView();};
$('selected-only').onchange=e=>{onlySelected=e.target.checked;refreshFilteredView();};
$('page-size').onchange=e=>{pageSize=Number(e.target.value);page=0;renderRows();};
$('prev-page').onclick=()=>{page--;renderRows();$('list-area').scrollTop=0;};$('next-page').onclick=()=>{page++;renderRows();$('list-area').scrollTop=0;};
$('prev-unit').onclick=()=>navigateUnit(-1);$('next-unit').onclick=()=>navigateUnit(1);$('review-next').onclick=reviewNext;$('task-toggle').onclick=toggleTask;$('bulk-translate').onclick=translateSelected;$('bulk-review').onclick=bulkReview;$('bulk-trial').onclick=()=>buildPatch(true);$('retranslate').onclick=retranslate;
$('translation').addEventListener('input',()=>{editorDirty=true;clearTimeout(saveTimer);$('save-status').textContent='正在保存…';$('save-status').classList.remove('saved');$('char-count').textContent=Array.from($('translation').value).length+' 字';renderValidation();saveTimer=setTimeout(flushEdit,500);});
$('translation').addEventListener('blur',flushEdit);
$('validation').addEventListener('click',e=>{if(!e.target.closest('#insert-markers'))return;const u=activeUnit(),input=$('translation'),current=markers(input.value),missing=[];for(const m of markers(u.source)){const i=current.indexOf(m);if(i>=0)current.splice(i,1);else missing.push(m);}input.setRangeText(missing.join(''),input.selectionStart,input.selectionEnd,'end');input.dispatchEvent(new Event('input'));input.focus();});
$('terms').addEventListener('click',e=>{const term=e.target.closest('[data-term]')?.dataset.term;if(!term)return;const input=$('translation');input.setRangeText(term,input.selectionStart,input.selectionEnd,'end');input.dispatchEvent(new Event('input'));input.focus();});
$('show-original').onclick=()=>{originalVisible=!originalVisible;$('original-draft').classList.toggle('hide',!originalVisible);$('original-draft').textContent=activeUnit().initial;$('show-original').textContent=originalVisible?'收起模型初稿':'查看模型初稿';};
$('toggle-review').onclick=()=>{flushEdit();activeUnit().reviewed=false;persist();renderTask();renderRows();renderEditorStatus();toast('已标为待校对，译文保持不变。');};
$('work-tab').onclick=()=>setView('work');$('patch-tab').onclick=()=>setView('patch');$('close-dialog').onclick=closeModal;$('dialog').addEventListener('close',()=>{$('dialog-body').onchange=null;});$('scenario').onchange=e=>applyScenario(e.target.value);
$('reset-demo').onclick=()=>showModal('重置原型示例','<p>清除本原型中的示例编辑、选择和补丁记录，恢复初始场景。实际应用和游戏数据不会受到影响。</p>',[{label:'取消',action:closeModal},{label:'重置示例',primary:true,action:()=>{clearTimeout(saveTimer);editorDirty=false;state=seed();persist();closeModal();resetFilters();setView('work');$('scenario').value='running';renderAll();toast('示例已重置。');}}]);
document.addEventListener('keydown',e=>{if($('dialog').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setView('work');$('search').focus();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();flushEdit();toast(storageFailed?'浏览器未允许本地保存。':'当前编辑已保存在此浏览器。');}if(view==='work'&&filtered().length&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();reviewNext();}if(view==='work'&&e.altKey&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();navigateUnit(e.key==='ArrowDown'?1:-1);}});
window.addEventListener('pagehide',flushEdit);
setInterval(()=>{if(document.hidden)return;let changed=false;for(const p of state.projects){if(p.task!=='running')continue;const u=p.units.find(v=>!v.text.trim()&&!v.human&&(!p.queue||p.queue.includes(v.id)));if(!u){p.task='complete';eventLog('本轮翻译已完成，可继续校对或生成补丁。',p);changed=true;continue;}if(p.id===state.projectId&&u.id===p.active&&editorDirty)continue;u.text=u.suggestion;u.initial=u.suggestion;u.failed=false;u.reviewed=false;p.tokens+=264;p.newly++;p.revision++;eventLog(`已保存第 ${u.id} 条译文。`,p);changed=true;if(p.id===state.projectId&&u.id===p.active&&!editorDirty)renderEditor();}if(changed){persist();renderSidebar();renderTask();renderRows();if(view==='patch')renderPatch();}},7000);
renderAll();$('scenario').value=['running','error','fresh'].includes(project().task)?project().task:'complete';
</script>
</body>
</html>
