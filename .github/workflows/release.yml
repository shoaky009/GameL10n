name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read release notes
        run: |
          $tag = [regex]::Match($env:GITHUB_REF_NAME, '^v(?<version>\d+\.\d+\.\d+)(?:-rc\d+)?$')
          if (-not $tag.Success) {
              throw 'Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN.'
          }
          $version = $tag.Groups['version'].Value
          $versionPattern = [regex]::Escape($version)
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $sections = [regex]::Matches($changelog, "(?ms)^## \[$versionPattern\][^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)")
          if ($sections.Count -ne 1 -or [string]::IsNullOrWhiteSpace($sections[0].Groups['notes'].Value)) {
              throw "CHANGELOG.md must contain one nonempty section for [$version]."
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-notes.md'), $sections[0].Groups['notes'].Value.Trim())

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build and verify release package
        run: |
          ./scripts/publish.ps1
          & ./target/runtime/python/python.exe -I -X utf8 ./scripts/build_vntextpatch.py --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Native parser verification failed.' }
          ./scripts/build-fontbridge.ps1 -Test
          & ./target/runtime/python/python.exe -I -X utf8 ./crates/engines/python/test_gdiplus_font_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Font bridge import verification failed.' }

      - name: Archive release package
        run: |
          Compress-Archive -LiteralPath ./artifacts/GameL10n `
              -DestinationPath "./artifacts/GameL10n-${env:GITHUB_REF_NAME}-win-x64.zip" -CompressionLevel Optimal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/GameL10n-${{ github.ref_name }}-win-x64.zip
          fail_on_unmatched_files: true
