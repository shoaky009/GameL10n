name: 功能需求
description: 为 GameL10n 提出新功能或改进建议。
title: "[Feature] "
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 说明希望完成的任务，以及目前遇到的问题或限制。
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: 期望结果
      description: 描述希望实现的效果，可提供具体示例帮助说明需求。
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: 建议方案或替代方式
      description: 如有实现思路、临时解决方法或其他替代方案，请在此说明。
