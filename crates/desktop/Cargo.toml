[package]
name = "gamel10n-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gamel10n-core.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = "0.4"
gamel10n-translation.workspace = true
gamel10n-engines.workspace = true
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# Match Slint exactly: window restoration needs renderer damage invalidation.
i-slint-core = { version = "=1.18.1", default-features = false }

[build-dependencies]
slint-build.workspace = true
winresource = "0.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile.workspace = true

[lints]
workspace = true
